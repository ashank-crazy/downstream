[project]
name = "downstream"
version = "0.1.0"
description = "A Switch teammate that tells other teams when something they depend on changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
claude = ["anthropic>=0.75"]

[project.scripts]
downstream = "downstream.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
